<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="description" content="Elke zaterdag vijf trending recepten: weinig werk, veel Aziatisch, groente van het seizoen en goed te maken voor kinderen. Alles in grammen en milliliters.">
<title>Proef</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23DDE7D4'/%3E%3Ctext x='16' y='23' font-family='Helvetica,Arial,sans-serif' font-size='20' font-weight='700' text-anchor='middle' fill='%230E0C0A'%3EP%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* Layout: één kolom op papier. Per recept een smalle tekstkolom naast een groot tekenpaneel; maten en cijfers in mono. */
:root {
  --paper: #EEEBE4;
  --ink: #0E0C0A;
  --muted: #6B655B;
  --rule: #D6D0C4;
  --panel: #E5E1D8;
  --accent: #3B5733;
  --sage: #DDE7D4; --peach: #F4DFCF; --lavender: #E3DEF0; --butter: #F2EAC8; --sky: #D8E5EF; --rose: #F1DBE0;
  --font-sans: "Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-mono: "Geist Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --t-xs: 0.78rem;
  --t-sm: 0.9rem;
  --t-md: 1.0625rem;
  --t-lg: 1.3rem;
  --t-xl: clamp(1.7rem, 3.2vw, 2.5rem);
  --t-2xl: clamp(2.4rem, 6vw, 4.6rem);
  --t-mark: clamp(3.6rem, 13vw, 8.5rem);
  --maxw: 1240px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0E0C0A; --ink: #ECE8E0; --muted: #9A9286; --rule: #2A2622; --panel: #171411; --accent: #A9C394;
    --sage: #232D20; --peach: #33271F; --lavender: #29263A; --butter: #302B1C; --sky: #1E2932; --rose: #332328;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0E0C0A; --ink: #ECE8E0; --muted: #9A9286; --rule: #2A2622; --panel: #171411; --accent: #A9C394;
    --sage: #232D20; --peach: #33271F; --lavender: #29263A; --butter: #302B1C; --sky: #1E2932; --rose: #332328;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
img { max-width: 100%; }
[hidden] { display: none !important; }
body {
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font-sans);
  font-size: var(--t-md);
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
@media (min-width: 760px) {
  body {
    padding-left: max(40px, env(safe-area-inset-left, 0px));
    padding-right: max(40px, env(safe-area-inset-right, 0px));
  }
}
.wrap { max-width: var(--maxw); margin-inline: auto; }
a { color: inherit; text-decoration-thickness: 1px; text-underline-offset: 0.2em; }
a:focus-visible, button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 2px; }
h1, h2, h3 { margin: 0; font-weight: 600; text-wrap: balance; }
p { margin: 0; }
.mono { font-family: var(--font-mono); font-size: var(--t-xs); letter-spacing: 0.02em; font-variant-numeric: tabular-nums; }
.label { font-family: var(--font-mono); font-size: var(--t-xs); color: var(--muted); letter-spacing: 0.04em; text-transform: uppercase; }
.muted { color: var(--muted); }

/* Kop */
.top { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; padding-block: 20px; }
.top .brand { font-family: var(--font-mono); font-size: var(--t-sm); text-decoration: none; }
.top .brand span { color: var(--muted); margin-right: 0.4em; }
.top nav { display: flex; gap: 22px; font-family: var(--font-mono); font-size: var(--t-xs); }
.top nav a { text-decoration: none; color: var(--muted); }
.top nav a:hover { color: var(--ink); }

/* Masthead */
.mast { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: end; gap: 16px clamp(20px, 4vw, 48px); padding-block: clamp(12px, 3vw, 32px) clamp(14px, 2vw, 22px); border-bottom: 1px solid var(--ink); }
.mast .intro { font-size: var(--t-md); line-height: 1.45; max-width: 52ch; padding-bottom: 0.4em; }
.mark { font-size: var(--t-mark); line-height: 0.8; letter-spacing: -0.06em; font-weight: 600; margin-left: -0.04em; }
.issue { display: grid; gap: 4px; text-align: right; padding-bottom: 0.35em; }
.issue .no { font-family: var(--font-mono); font-size: var(--t-lg); font-weight: 500; }
.lede { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: clamp(20px, 4vw, 56px); padding-block: clamp(22px, 4vw, 40px); }
.lede .tagline { font-size: var(--t-lg); line-height: 1.35; max-width: 26ch; }
.principles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px clamp(20px, 3vw, 40px); }
.principles p { font-size: var(--t-sm); color: var(--muted); max-width: 42ch; }
.principles strong { display: block; color: var(--ink); font-weight: 500; margin-bottom: 4px; font-size: var(--t-sm); }

/* Editie */
.notice { font-size: var(--t-sm); color: var(--muted); padding-top: 16px; }
.features { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: clamp(28px, 4vw, 44px) clamp(16px, 2.4vw, 28px); padding-block: clamp(20px, 3vw, 32px) clamp(40px, 6vw, 72px); }
.feature { display: grid; gap: 12px; align-content: start; min-width: 0; }
.feature:first-child { grid-column: span 2; }
.feature-text { display: grid; gap: 8px; min-width: 0; }
.feature h2 { font-size: var(--t-lg); line-height: 1.15; letter-spacing: -0.02em; }
.feature:first-child h2 { font-size: var(--t-xl); line-height: 1.05; letter-spacing: -0.03em; }
.feature h2 a { text-decoration: none; }
.feature h2 a:hover { text-decoration: underline; text-decoration-thickness: 2px; }
.feature .dek { color: var(--muted); font-size: var(--t-sm); max-width: 52ch; }
.meta-row { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; font-family: var(--font-mono); font-size: var(--t-xs); color: var(--muted); }
.tags { display: flex; flex-wrap: wrap; gap: 6px; }
.tag { font-family: var(--font-mono); font-size: 0.72rem; padding: 3px 8px; border-radius: 99px; background: var(--tint, var(--panel)); color: var(--ink); }
.signal { display: flex; flex-wrap: wrap; gap: 10px; align-items: baseline; font-family: var(--font-mono); font-size: var(--t-xs); letter-spacing: 0.02em; }
.signal .metric { color: var(--accent); font-weight: 500; font-size: var(--t-sm); }
.signal .src { color: var(--muted); }
.split { display: grid; grid-template-columns: 1fr 1fr; border-radius: 6px; overflow: hidden; text-decoration: none; background: var(--tint); }
.split > * { min-width: 0; aspect-ratio: 1 / 1; width: 100%; max-width: 100%; }
.split canvas { display: block; background: var(--tint); }
.split img { display: block; object-fit: cover; height: 100%; }
.split .ph { display: grid; align-content: space-between; padding: clamp(12px, 2vw, 20px); background: color-mix(in srgb, var(--tint) 55%, var(--ink) 8%); }
.split .ph .big { font-family: var(--font-mono); font-size: clamp(1.4rem, 3vw, 2.4rem); line-height: 1; letter-spacing: -0.03em; color: var(--accent); font-weight: 500; overflow-wrap: anywhere; }
.feature:first-child .split .ph .big { font-size: clamp(1.8rem, 5vw, 3.6rem); }
.split .ph .big.word { font-size: clamp(1rem, 1.8vw, 1.5rem); letter-spacing: -0.01em; overflow-wrap: normal; }
.feature:first-child .split .ph .big.word { font-size: clamp(1.3rem, 3vw, 2.2rem); }
.credit { font-family: var(--font-mono); font-size: var(--t-xs); color: var(--muted); }
.credit a { color: inherit; }
.split .ph .cap { font-family: var(--font-mono); font-size: var(--t-xs); color: var(--muted); }
.t-sage { --tint: var(--sage); } .t-peach { --tint: var(--peach); } .t-lavender { --tint: var(--lavender); } .t-butter { --tint: var(--butter); } .t-sky { --tint: var(--sky); } .t-rose { --tint: var(--rose); }
.feature-visual:hover + .feature-text h2 a { text-decoration: underline; text-decoration-thickness: 2px; }

.panel { background: var(--panel); border-radius: 4px; overflow: hidden; display: block; text-decoration: none; min-width: 0; }
.panel-bar { display: flex; justify-content: space-between; gap: 12px; padding: 10px 14px; border-bottom: 1px solid var(--rule); color: var(--muted); }
.panel canvas { display: block; width: 100%; max-width: 100%; aspect-ratio: 4 / 3; }

/* Archief */
.archive { padding-block: clamp(40px, 7vw, 88px); border-top: 1px solid var(--ink); display: grid; grid-template-columns: minmax(0, 4fr) minmax(0, 7fr); gap: clamp(20px, 4vw, 56px); }
.archive h2 { font-size: var(--t-xl); letter-spacing: -0.03em; margin-top: 10px; }
.archive .side { display: grid; gap: 18px; align-content: start; }
.search { display: grid; gap: 6px; }
.search input { font: inherit; font-size: var(--t-md); color: var(--ink); background: transparent; border: 0; border-bottom: 1px solid var(--ink); padding: 8px 0; width: 100%; border-radius: 0; }
.search input::placeholder { color: var(--muted); }
.list { list-style: none; margin: 0; padding: 0; min-width: 0; }
.list > li { display: grid; grid-template-columns: 4.5ch minmax(0, 1fr); gap: 16px; padding-block: 16px; border-top: 1px solid var(--rule); }
.list > li:last-child { border-bottom: 1px solid var(--rule); }
.list .no { font-family: var(--font-mono); font-size: var(--t-sm); color: var(--muted); }
.list .when { font-family: var(--font-mono); font-size: var(--t-xs); color: var(--muted); margin-bottom: 6px; }
.list .titles { display: flex; flex-wrap: wrap; gap: 4px 18px; }
.list .titles a { text-decoration: none; }
.list .titles a:hover { text-decoration: underline; }
.list .hit-meta { font-family: var(--font-mono); font-size: var(--t-xs); color: var(--muted); }
.empty { color: var(--muted); padding-block: 16px; border-top: 1px solid var(--rule); }

/* Recept */
.recipe { padding-block: clamp(20px, 4vw, 40px) clamp(40px, 7vw, 88px); }
.back { font-family: var(--font-mono); font-size: var(--t-xs); color: var(--muted); text-decoration: none; display: inline-block; margin-bottom: clamp(24px, 4vw, 48px); }
.back:hover { color: var(--ink); }
.recipe-top { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 6fr); gap: clamp(24px, 4vw, 56px); align-items: end; }
.recipe-head { display: grid; gap: 14px; }
.recipe-head h1 { font-size: var(--t-2xl); line-height: 0.98; letter-spacing: -0.04em; }
.recipe-head .dek { font-size: var(--t-lg); line-height: 1.4; color: var(--muted); max-width: 44ch; }
.facts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); margin: clamp(16px, 3vw, 28px) 0 0; border-top: 1px solid var(--ink); }
.facts > div:nth-child(n+3) { border-top: 1px solid var(--rule); }
.facts > div { padding: 14px 16px 14px 0; display: grid; gap: 6px; align-content: start; min-width: 0; }
.facts dt { font-family: var(--font-mono); font-size: var(--t-xs); color: var(--muted); letter-spacing: 0.04em; text-transform: uppercase; }
.facts dd { margin: 0; }
.facts .metric { color: var(--accent); font-family: var(--font-mono); font-weight: 500; }
.stepper { display: inline-flex; align-items: center; gap: 10px; }
.stepper button { font: inherit; font-family: var(--font-mono); width: 30px; height: 30px; border-radius: 50%; border: 1px solid var(--rule); background: transparent; color: var(--ink); cursor: pointer; line-height: 1; }
.stepper button:hover:not(:disabled) { border-color: var(--ink); }
.stepper button:disabled { opacity: 0.35; cursor: default; }
.stepper output { font-variant-numeric: tabular-nums; min-width: 6ch; }

.recipe-body { display: grid; grid-template-columns: minmax(0, 4fr) minmax(0, 7fr); gap: clamp(28px, 5vw, 64px); margin-top: clamp(28px, 4vw, 48px); }
.section-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding-bottom: 12px; border-bottom: 1px solid var(--ink); margin-bottom: 4px; }
.section-head h2 { font-size: var(--t-lg); letter-spacing: -0.02em; }
.copy { font-family: var(--font-mono); font-size: var(--t-xs); color: var(--muted); background: none; border: 0; padding: 4px 0; cursor: pointer; text-decoration: underline; text-underline-offset: 0.2em; }
.copy:hover { color: var(--ink); }
.ing-group { font-family: var(--font-mono); font-size: var(--t-xs); color: var(--muted); letter-spacing: 0.04em; text-transform: uppercase; padding: 20px 0 6px; }
.ings { list-style: none; margin: 0; padding: 0; }
.ings li { display: grid; grid-template-columns: 7ch minmax(0, 1fr); gap: 14px; padding-block: 9px; border-bottom: 1px solid var(--rule); font-size: var(--t-sm); }
.ings .q { font-family: var(--font-mono); font-size: var(--t-xs); text-align: right; padding-top: 2px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.steps { list-style: none; margin: 0; padding: 0; counter-reset: stap; }
.steps li { counter-increment: stap; display: grid; grid-template-columns: 3ch minmax(0, 1fr); gap: 14px; padding-block: 16px; border-bottom: 1px solid var(--rule); max-width: 68ch; }
.steps li::before { content: counter(stap); font-family: var(--font-mono); font-size: var(--t-xs); color: var(--muted); padding-top: 4px; }
.tip { margin-top: 28px; display: grid; gap: 8px; max-width: 62ch; }
.why { margin-top: 28px; padding: 16px; border-radius: 6px; background: var(--tint); display: grid; gap: 10px; }
.why .big { font-family: var(--font-mono); font-size: var(--t-xl); line-height: 1; letter-spacing: -0.04em; color: var(--accent); font-weight: 500; overflow-wrap: anywhere; }
.why .src { margin-top: 2px; }
.why .why-text { font-size: var(--t-sm); }
.links { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; font-family: var(--font-mono); font-size: var(--t-xs); }
.links a { text-decoration: none; border-bottom: 1px solid var(--rule); }
.links a:hover { border-color: var(--ink); }
.pager { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px; margin-top: clamp(40px, 6vw, 72px); border-top: 1px solid var(--rule); padding-top: 20px; }
.pager a { text-decoration: none; display: grid; gap: 6px; }
.pager a:hover strong { text-decoration: underline; }
.pager .next { text-align: right; }
.pager strong { font-weight: 500; font-size: var(--t-lg); letter-spacing: -0.02em; }

/* Status en voet */
.status { padding-block: 48px; color: var(--muted); font-family: var(--font-mono); font-size: var(--t-xs); }
.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--paper); font-family: var(--font-mono); font-size: var(--t-xs); padding: 10px 16px; border-radius: 4px; }
footer { margin-top: 24px; }
footer canvas { display: block; width: 100%; max-width: 100%; height: 150px; }
.foot { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px 24px; padding-block: 18px 32px; border-top: 1px solid var(--rule); color: var(--muted); }

@media (min-width: 761px) and (max-width: 1020px) {
  .features { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 760px) {
  .mast { grid-template-columns: minmax(0, 1fr) auto; }
  .mast .intro { grid-column: 1 / -1; grid-row: 2; }
  .features { grid-template-columns: minmax(0, 1fr); }
  .feature:first-child { grid-column: auto; }
  .archive, .recipe-body, .recipe-top { grid-template-columns: minmax(0, 1fr); }
}
@media (prefers-reduced-motion: reduce) {
  .more::after { transition: none; }
}
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <a class="brand" href="#deze-week"><span>/</span>Proef</a>
    <nav aria-label="Hoofdmenu">
      <a href="#deze-week">Deze week</a>
      <a href="#archief">Archief</a>
    </nav>
  </header>

  <main id="home">
    <section class="mast" aria-label="Proef">
      <h1 class="mark">Proef</h1>
      <div>
        <p class="label" id="edition-label">Deze week</p>
        <p class="intro" id="edition-intro">Recepten laden…</p>
      </div>
      <div class="issue" id="issue">
        <span class="no">Nº —</span>
        <span class="mono muted">Week —</span>
      </div>
    </section>
    <p class="notice" id="edition-notice" hidden>Je bekijkt een eerdere editie. <a href="#deze-week">Naar deze week →</a></p>

    <div class="features" id="features"></div>

    <section class="archive" id="archief" aria-labelledby="archief-titel">
      <div class="side">
        <div>
          <p class="label">Archief</p>
          <h2 id="archief-titel">Alle edities</h2>
        </div>
        <label class="search" for="zoek">
          <span class="label">Zoeken</span>
          <input id="zoek" type="search" placeholder="Recept of ingrediënt" autocomplete="off">
        </label>
      </div>
      <div id="archive-list"></div>
    </section>
  </main>

  <main id="recipe-view" hidden></main>

  <footer>
    <canvas id="contour" aria-hidden="true"></canvas>
    <div class="foot mono">
      <span>© 2026 Proef</span>
      <span>Samengesteld met Claude · trenddata van Pinterest, Google en TikTok</span>
    </div>
  </footer>
</div>
<div class="toast" id="toast" role="status" hidden></div>

<script>
(() => {
  "use strict";
  const TAU = Math.PI * 2;
  const state = { editions: [], bySlug: new Map(), lastSlug: null };
  const drawn = new Map();
  const $ = (id) => document.getElementById(id);

  /* ---------- DOM-hulp ---------- */
  function h(tag, attrs, ...kids) {
    const el = document.createElement(tag);
    if (attrs) for (const [k, v] of Object.entries(attrs)) {
      if (v == null || v === false) continue;
      if (k === "class") el.className = v;
      else if (k === "text") el.textContent = v;
      else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
      else el.setAttribute(k, v === true ? "" : v);
    }
    for (const kid of kids.flat()) if (kid != null && kid !== false) el.append(kid instanceof Node ? kid : document.createTextNode(String(kid)));
    return el;
  }
  const pad = (n) => String(n).padStart(2, "0");
  const dateFmt = new Intl.DateTimeFormat("nl-NL", { day: "numeric", month: "long", year: "numeric" });
  const fmtDate = (iso) => dateFmt.format(new Date(iso + "T12:00:00"));
  const nf = new Intl.NumberFormat("nl-NL", { maximumFractionDigits: 1 });
  const singular = { personen: "persoon", glazen: "glas", koekjes: "koekje", stuks: "stuk", porties: "portie" };
  const norm = (s) => String(s || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");

  function fmtQty(ing, factor) {
    if (ing.qty == null) return "";
    let v = ing.fixed ? ing.qty : ing.qty * factor;
    const u = ing.unit || "";
    if (u === "g" || u === "ml") {
      if (v < 10) v = Math.round(v * 2) / 2;
      else if (v < 100) v = Math.round(v);
      else if (v < 1000) v = Math.round(v / 5) * 5;
      else v = Math.round(v / 10) * 10;
      if (v <= 0) v = 0.5;
      if (v >= 1000) return nf.format(v / 1000) + (u === "g" ? " kg" : " l");
      return nf.format(v) + " " + u;
    }
    v = Math.round(v * 2) / 2;
    if (v <= 0) v = 0.5;
    const whole = Math.floor(v), half = v - whole > 0;
    return (whole ? String(whole) : "") + (half ? "½" : "") + (u ? " " + u : "");
  }

  /* ---------- Tekenwerk ---------- */
  function hashStr(s) { let x = 2166136261 >>> 0; for (const ch of s) { x ^= ch.charCodeAt(0); x = Math.imul(x, 16777619); } return x >>> 0; }
  function mulberry32(a) { return () => { a |= 0; a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
  function makeNoise(rng) {
    const perm = Array.from({ length: 256 }, (_, i) => i);
    for (let i = 255; i > 0; i--) { const j = Math.floor(rng() * (i + 1)); [perm[i], perm[j]] = [perm[j], perm[i]]; }
    const p = new Uint8Array(512); for (let i = 0; i < 512; i++) p[i] = perm[i & 255];
    const val = (ix, iy) => p[(p[ix & 255] + iy) & 255] / 255;
    const sm = (t) => t * t * (3 - 2 * t);

      ctx.beginPath(); for (let k = 1; k < 8; k++) { const an = t0 + span + (k * (TAU - span)) / 8; ctx.moveTo(cx, cy); ctx.lineTo(cx + Math.cos(an) * r, cy + Math.sin(an) * r); } strokeOnly(g, 0.6, 0.3);
      ctx.beginPath(); ctx.moveTo(sx, sy); ctx.arc(sx, sy, r, t0, t0 + span); ctx.closePath(); fillStroke(g, 1.25);
      dust(sx, sy, (x, y) => angIn(x, y, sx, sy, (an) => an > 0.03 && an < span - 0.03));
      for (let i = 0; i < 3; i++) { const an = mid + Math.PI + (i - 1) * 0.35, rad = R * 0.93; bean(g, cx + Math.cos(an) * rad, cy + Math.sin(an) * rad, S * 0.045, an + 1.2); }
    },

    glass(g) {
      const { ctx, cx, h, S, noise, rng } = g;
      const gx = cx - S * 0.04, top = h * 0.14, bot = h * 0.8, tw = S * 0.19, bw = S * 0.15;
      const sy = h * 0.84;
      ctx.beginPath(); ctx.ellipse(gx, sy, S * 0.36, S * 0.06, 0, 0, TAU); fillStroke(g, 1.2);
      ctx.beginPath(); ctx.ellipse(gx, sy - S * 0.008, S * 0.22, S * 0.035, 0, 0, TAU); strokeOnly(g, 0.7, 0.45);
      const gp = () => { ctx.beginPath(); ctx.moveTo(gx - tw, top); ctx.lineTo(gx - bw, bot - S * 0.02); ctx.quadraticCurveTo(gx - bw, bot, gx - bw + S * 0.02, bot); ctx.lineTo(gx + bw - S * 0.02, bot); ctx.quadraticCurveTo(gx + bw, bot, gx + bw, bot - S * 0.02); ctx.lineTo(gx + tw, top); ctx.closePath(); };
      gp(); ctx.globalAlpha = 1; ctx.fillStyle = g.bg; ctx.fill();
      ctx.save(); gp(); ctx.clip();
      const span = bot - top, yS = bot - span * 0.1, yE = bot - span * 0.34, yM = bot - span * 0.76, yF = top + span * 0.04;
      const wave = (y0, amp, ph) => (x) => y0 + (noise(x / (S * 0.09) + ph, ph, 2) - 0.5) * amp;
      const fS = wave(yS, S * 0.02, 5), fE = wave(yE, S * 0.05, 2), fM = wave(yM, S * 0.035, 9);
      ctx.beginPath(); for (let y = yS - S * 0.02; y < bot; y += 2.6) { ctx.moveTo(gx - tw, y); ctx.lineTo(gx + tw, y); }
      ctx.save(); ctx.globalCompositeOperation = "source-over"; strokeOnly(g, 0.55, 0.5); ctx.restore();
      contourLines(g, { x0: gx - tw, y0: yE - S * 0.05, x1: gx + tw, y1: yS + 4, step: Math.max(2, S / 130), field: (x, y) => noise(x / (S * 0.05), y / (S * 0.03), 3), inside: (x, y) => y > fE(x) && y < fS(x) - 1, levels: lv(7, 0.32, 0.68), alpha: 0.6 });
      for (const f of [fS, fE, fM]) { polyline(ctx, f, gx - tw, gx + tw); strokeOnly(g, 0.9, 0.8); }
      ctx.beginPath(); for (let k = 0; k < 3; k++) { const y0 = yM + (yE - yM) * (0.3 + k * 0.22); polyline(ctx, wave(y0, S * 0.05, 13 + k * 4), gx - tw * 0.7, gx + tw * 0.5, 40); strokeOnly(g, 0.6, 0.25); }
      for (let i = 0; i < 300; i++) { const x = gx - tw + rng() * 2 * tw, y = yF + rng() * (yM - yF); if (y > fM(x) - 1) continue; dot(g, x, y, 0.6); }
      ctx.restore();
      gp(); strokeOnly(g, 1.3);
      ctx.beginPath(); ctx.ellipse(gx, top, tw, S * 0.028, 0, 0, TAU); fillStroke(g, 1.2);
      for (let i = 0; i < 70; i++) { const a = rng() * TAU, d = Math.sqrt(rng()); dot(g, gx + Math.cos(a) * d * tw * 0.9, top + Math.sin(a) * d * S * 0.022, 0.6); }
      // kaneelstokje
      const p0 = [gx + tw * 0.25, top + S * 0.16], p1 = [gx + tw * 0.95, top - S * 0.1];
      const dx = p1[0] - p0[0], dy = p1[1] - p0[1], dl = Math.hypot(dx, dy), nx = (-dy / dl) * S * 0.016, ny = (dx / dl) * S * 0.016;
      ctx.beginPath(); ctx.moveTo(p0[0] + nx, p0[1] + ny); ctx.lineTo(p1[0] + nx, p1[1] + ny); ctx.lineTo(p1[0] - nx, p1[1] - ny); ctx.lineTo(p0[0] - nx, p0[1] - ny); ctx.closePath(); fillStroke(g, 1.1);
      ctx.beginPath(); ctx.moveTo(p0[0] + nx * 0.2, p0[1] + ny * 0.2); ctx.lineTo(p1[0] + nx * 0.2, p1[1] + ny * 0.2); strokeOnly(g, 0.6, 0.6);
      spiral(g, p1[0], p1[1], S * 0.016, 1.6, Math.atan2(dy, dx));
      // banaanschijf op de schotel
      const bx = gx + S * 0.27, by = sy - S * 0.004;
      ctx.beginPath(); ctx.ellipse(bx, by, S * 0.045, S * 0.02, 0, 0, TAU); fillStroke(g, 1);
      ctx.beginPath(); ctx.ellipse(bx, by, S * 0.034, S * 0.014, 0, 0, TAU); strokeOnly(g, 0.6, 0.6);
      for (let i = 0; i < 6; i++) { const a = (i / 6) * TAU; dot(g, bx + Math.cos(a) * S * 0.01, by + Math.sin(a) * S * 0.004, 0.7); }
    },

    tray(g) {
      const { ctx, w, h, S, noise, rng } = g;
      const dw = w * 0.7, dh = h * 0.66, dx = (w - dw) / 2, dy = (h - dh) / 2;
      rr(ctx, dx - S * 0.07, h / 2 - S * 0.07, S * 0.12, S * 0.14, S * 0.04); fillStroke(g, 1.2);
      rr(ctx, dx + dw - S * 0.05, h / 2 - S * 0.07, S * 0.12, S * 0.14, S * 0.04); fillStroke(g, 1.2);
      rr(ctx, dx, dy, dw, dh, S * 0.06); fillStroke(g, 1.3);
      const ix = dx + S * 0.04, iy = dy + S * 0.04, iw = dw - S * 0.08, ih = dh - S * 0.08;
      rr(ctx, ix, iy, iw, ih, S * 0.04); strokeOnly(g, 0.9, 0.8);
      ctx.save(); rr(ctx, ix, iy, iw, ih, S * 0.04); ctx.clip();
      contourLines(g, { x0: ix, y0: iy, x1: ix + iw, y1: iy + ih, step: Math.max(2.5, S / 110), field: (x, y) => noise(x / (S * 0.11), y / (S * 0.11), 3), levels: lv(9, 0.3, 0.7), alpha: 0.4 });
      scatter(16, S * 0.075, () => [ix + S * 0.04 + rng() * (iw - S * 0.08), iy + S * 0.04 + rng() * (ih - S * 0.08)]).forEach((p, i) => {
        if (i % 3 === 0) leaf(g, p[0], p[1], S * 0.06, rng() * TAU);
        else { const s = S * (0.026 + rng() * 0.018); ctx.save(); ctx.translate(p[0], p[1]); ctx.rotate(rng() * TAU); rr(ctx, -s, -s, 2 * s, 2 * s, s * 0.35); fillStroke(g, 1); ctx.restore(); }
      });
      ctx.restore();
    },
  };

  function readColors(prop) { return getComputedStyle(document.documentElement).getPropertyValue(prop).trim(); }
  function prep(canvas) {
    const rect = canvas.getBoundingClientRect(); const w = rect.width, hh = rect.height;
    if (!w || !hh) return null;
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    canvas.width = Math.round(w * dpr); canvas.height = Math.round(hh * dpr);
    const ctx = canvas.getContext("2d"); ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, w, hh);
    ctx.lineCap = "round"; ctx.lineJoin = "round";
    return { ctx, w, h: hh };
  }
  function drawDish(canvas, form, seed) {
    const base = prep(canvas); if (!base) return;
    const rng = mulberry32(hashStr(seed));
    const g = { ...base, cx: base.w / 2, cy: base.h / 2, S: Math.min(base.w, base.h), rng, noise: makeNoise(rng), ink: readColors("--ink"), bg: getComputedStyle(canvas).backgroundColor || readColors("--panel") };
    try { (FORMS[form] || FORMS.plate)(g); } catch (e) { /* tekening overslaan bij een fout */ }
  }
  function drawFooter() {
    const canvas = $("contour"); const base = prep(canvas); if (!base) return;
    const rng = mulberry32(hashStr("proef-noord")), noise = makeNoise(rng);
    contourLines({ ...base, ink: readColors("--muted") }, { x0: 0, y0: 0, x1: base.w, y1: base.h, step: 4, field: (x, y) => noise(x / 260, y / 130, 4) * 0.85 + (y / base.h) * 0.15, levels: lv(14, 0.25, 0.75), alpha: 0.5, lw: 0.8 });
  }

  const ro = "ResizeObserver" in window ? new ResizeObserver((entries) => { for (const en of entries) { const d = drawn.get(en.target); if (d) requestAnimationFrame(() => drawDish(en.target, d.form, d.seed)); else if (en.target.id === "contour") requestAnimationFrame(drawFooter); } }) : null;
  function dishCanvas(r, label) {
    const c = h("canvas", { role: "img", "aria-label": label });
    drawn.set(c, { form: r.form, seed: r.slug });
    if (ro) ro.observe(c);
    return c;
  }
  function redrawAll() { for (const [c, d] of drawn) if (c.isConnected) drawDish(c, d.form, d.seed); drawFooter(); }

  /* ---------- Weergaven ---------- */
  const servingsText = (r, n) => { const lab = r.servingsLabel || "personen"; return n + " " + (n === 1 ? singular[lab] || lab : lab); };
  const metaLine = (r) => `${r.minutes} min · ${servingsText(r, r.servings)}`;
  const tintClass = (r) => "t-" + (["sage", "peach", "lavender", "butter", "sky", "rose"].includes(r.tint) ? r.tint : "sage");
  const tagList = (r) => (r.tags || []).length ? h("div", { class: "tags" }, r.tags.map((t) => h("span", { class: "tag", text: t }))) : null;
  function splitVisual(r, href) {
    const tile = () => h("div", { class: "ph", "aria-hidden": "true" }, h("span", { class: "cap", text: "Signaal" }), h("span", { class: "big" + ((r.signal?.metric || "").length > 6 ? " word" : ""), text: r.signal?.metric || "" }), h("span", { class: "cap", text: r.signal?.source || "" }));
    let half = tile();
    if (r.photo) {
      half = h("img", { src: r.photo, alt: "Foto van " + r.title + (r.photoCredit ? " (" + r.photoCredit.label + ")" : ""), loading: "lazy", referrerpolicy: "no-referrer", decoding: "async" });
      half.addEventListener("error", () => half.replaceWith(tile()), { once: true });
    }
    return h(href ? "a" : "div", { class: "split feature-visual " + tintClass(r), href: href || null, "aria-label": href ? r.title : null }, dishCanvas(r, "Lijntekening van " + r.title), half);
  }

  function renderMast(ed) {
    const issue = $("issue"); issue.replaceChildren(
      h("span", { class: "no", text: "Nº " + pad(ed.number) }),
      h("span", { class: "mono muted", text: `Week ${ed.week} · ${ed.year}` }),
      h("span", { class: "mono muted", text: fmtDate(ed.date) })
    );
  }

  function showHome(ed, target) {
    $("recipe-view").hidden = true; $("home").hidden = false;
    renderMast(ed);
    const latest = ed === state.editions[0];
    $("edition-label").textContent = latest ? "Deze week" : `Editie ${pad(ed.number)} · week ${ed.week}`;
    $("edition-intro").textContent = ed.intro || "";
    $("edition-notice").hidden = latest;
    const box = $("features"); box.replaceChildren();
    ed.recipes.forEach((r) => {
      const text = h("div", { class: "feature-text " + tintClass(r) },
        h("p", { class: "signal" }, h("span", { class: "metric", text: r.signal?.metric || "" }), h("span", { class: "src", text: r.signal?.source || "" })),
        h("h2", { id: "f-" + r.slug }, h("a", { href: "#" + r.slug, text: r.title })),
        h("p", { class: "dek", text: r.dek || "" }),
        h("div", { class: "meta-row" }, h("span", { text: metaLine(r) }), r.photoCredit ? h("span", { text: "Foto: " + r.photoCredit.label }) : null, tagList(r)));
      box.append(h("article", { class: "feature", "aria-labelledby": "f-" + r.slug }, splitVisual(r, "#" + r.slug), text));
    });
    requestAnimationFrame(redrawAll);
    if (target === "archief") $("archief").scrollIntoView();
    else if (state.lastSlug && $("f-" + state.lastSlug)) { $("f-" + state.lastSlug).closest("article").scrollIntoView({ block: "center" }); }
    else window.scrollTo(0, 0);
    state.lastSlug = null;
  }

  function showRecipe(r) {
    const ed = r._edition;
    const base = r.servings || 1, step = base >= 8 ? Math.max(1, Math.round(base / 4)) : 1;
    let n = base;
    const out = h("output", { "aria-live": "polite" });
    const minus = h("button", { type: "button", "aria-label": "Minder", text: "−" });
    const plus = h("button", { type: "button", "aria-label": "Meer", text: "+" });
    const qtyCells = [];
    const groups = []; let cur = null;
    for (const ing of r.ingredients || []) { const g = ing.group || ""; if (!cur || cur.name !== g) { cur = { name: g, items: [] }; groups.push(cur); } cur.items.push(ing); }
    const ingBox = h("div");
    for (const grp of groups) {
      if (grp.name) ingBox.append(h("p", { class: "ing-group", text: grp.name }));
      const ul = h("ul", { class: "ings" });
      for (const ing of grp.items) { const q = h("span", { class: "q" }); qtyCells.push([q, ing]); ul.append(h("li", null, q, h("span", { text: ing.item }))); }
      ingBox.append(ul);
    }
    const update = () => {
      out.textContent = servingsText(r, n);
      minus.disabled = n - step < step; plus.disabled = n + step > base * 4;
      for (const [q, ing] of qtyCells) q.textContent = fmtQty(ing, n / base);
    };
    minus.addEventListener("click", () => { n = Math.max(step, n - step); update(); });
    plus.addEventListener("click", () => { n = Math.min(base * 4, n + step); update(); });
    update();

    const copyBtn = h("button", { type: "button", class: "copy", text: "Kopieer lijst" });
    copyBtn.addEventListener("click", () => {
      const lines = [`${r.title} (${servingsText(r, n)})`];
      for (const grp of groups) { if (grp.name) lines.push("", grp.name); for (const ing of grp.items) { const q = fmtQty(ing, n / base); lines.push("- " + (q ? q + " " : "") + ing.item); } }
      const text = lines.join("\n");
      const done = () => toast("Boodschappenlijst gekopieerd");
      const fallback = () => { const ta = h("textarea", { "aria-hidden": "true" }); ta.value = text; ta.style.cssText = "position:fixed;opacity:0;left:0;top:0"; document.body.append(ta); ta.select(); let ok = false; try { ok = document.execCommand("copy"); } catch (e) { ok = false; } ta.remove(); toast(ok ? "Boodschappenlijst gekopieerd" : "Kopiëren lukt hier niet. Selecteer de lijst handmatig."); };
      try { navigator.clipboard.writeText(text).then(done, fallback); } catch (e) { fallback(); }
    });

    const idx = ed.recipes.indexOf(r), prev = ed.recipes[idx - 1], next = ed.recipes[idx + 1];
    const view = $("recipe-view");
    view.replaceChildren(h("article", { class: "recipe" },
      h("a", { class: "back", href: "#editie-" + ed.id, text: `← Editie ${pad(ed.number)} · week ${ed.week}` }),
      h("div", { class: "recipe-top" },
        h("div", null,
          h("header", { class: "recipe-head " + tintClass(r) },
            h("p", { class: "label", text: r.category || "" }),
            h("h1", { text: r.title }),
            h("p", { class: "dek", text: r.dek || "" }),
            tagList(r)),
          h("dl", { class: "facts" },
            h("div", null, h("dt", { text: "Tijd" }), h("dd", { text: r.minutes + " min" })),
            h("div", null, h("dt", { text: r.servingsLabel ? "Aantal" : "Personen" }), h("dd", null, h("span", { class: "stepper" }, minus, out, plus))))),
        h("figure", { style: "margin:0;display:grid;gap:8px" }, splitVisual(r, null),
          r.photoCredit ? h("figcaption", { class: "credit" }, "Foto en origineel recept: ", h("a", { href: r.photoCredit.url, target: "_blank", rel: "noopener", text: r.photoCredit.label + " ↗" })) : null)),
      h("div", { class: "recipe-body" },
        h("section", { "aria-labelledby": "ing-t" }, h("div", { class: "section-head" }, h("h2", { id: "ing-t", text: "Ingrediënten" }), copyBtn), ingBox,
          h("aside", { class: "why " + tintClass(r), "aria-labelledby": "why-t" },
            h("p", { class: "label", id: "why-t", text: "Waarom deze week" }),
            h("p", { class: "big", text: r.signal?.metric || "" }),
            h("p", { class: "mono muted src", text: r.signal?.source || "" }),
            h("p", { class: "why-text", text: r.signal?.text || "" }),
            (r.links || []).length ? h("ul", { class: "links" }, r.links.map((l) => h("li", null, h("a", { href: l.url, target: "_blank", rel: "noopener", text: l.label + " ↗" })))) : null)),
        h("section", { "aria-labelledby": "steps-t" },
          h("div", { class: "section-head" }, h("h2", { id: "steps-t", text: "Bereiding" })),
          h("ol", { class: "steps" }, (r.steps || []).map((s) => h("li", null, h("span", { text: s })))),
          r.tip ? h("aside", { class: "tip" }, h("p", { class: "label", text: "Tip" }), h("p", { text: r.tip })) : null)),
      h("nav", { class: "pager", "aria-label": "Andere recepten" },
        prev ? h("a", { href: "#" + prev.slug }, h("span", { class: "label", text: "← Vorige" }), h("strong", { text: prev.title })) : h("span"),
        next ? h("a", { class: "next", href: "#" + next.slug }, h("span", { class: "label", text: "Volgende →" }), h("strong", { text: next.title })) : h("span"))
    ));
    $("home").hidden = true; view.hidden = false;
    state.lastSlug = r.slug;
    window.scrollTo(0, 0);
    requestAnimationFrame(redrawAll);
  }

  function renderArchive() {
    const q = norm($("zoek").value.trim());
    const box = $("archive-list");
    if (!q) {
      box.replaceChildren(h("ul", { class: "list" }, state.editions.map((ed) => h("li", null,
        h("a", { class: "no", href: "#editie-" + ed.id, text: pad(ed.number), "aria-label": "Editie " + ed.number }),
        h("div", null, h("p", { class: "when", text: `Week ${ed.week} · ${fmtDate(ed.date)}` }),
          h("div", { class: "titles" }, ed.recipes.map((r) => h("a", { href: "#" + r.slug, text: r.title }))))))));
      return;
    }
    const hits = [];
    for (const ed of state.editions) for (const r of ed.recipes) {
      const hay = norm([r.title, r.dek, r.category, ...(r.ingredients || []).map((i) => i.item)].join(" "));
      if (q.split(/\s+/).every((t) => hay.includes(t))) hits.push(r);
    }
    box.replaceChildren(hits.length
      ? h("ul", { class: "list" }, hits.map((r) => h("li", null,
          h("span", { class: "no", text: pad(r._edition.number) }),
          h("div", null, h("a", { href: "#" + r.slug, text: r.title }), h("p", { class: "hit-meta", text: `${r.category || ""} · ${r.minutes} min · week ${r._edition.week}` })))))
      : h("p", { class: "empty", text: "Geen recepten gevonden. Probeer een ander ingrediënt." }));
  }

  let toastTimer;
  function toast(msg) { const t = $("toast"); t.textContent = msg; t.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, 2200); }

  function route() {
    if (!state.editions.length) return;
    const hsh = decodeURIComponent(location.hash.slice(1));
    if (state.bySlug.has(hsh)) return showRecipe(state.bySlug.get(hsh));
    let ed = state.editions[0];
    if (hsh.startsWith("editie-")) { const f = state.editions.find((e) => "editie-" + e.id === hsh); if (f) { ed = f; state.lastSlug = null; } }
    if (hsh === "deze-week") state.lastSlug = null;
    showHome(ed, hsh);
  }

  async function load() {
    try {
      const res = await fetch("editions/index.json", { cache: "no-cache" });
      if (!res.ok) throw new Error("index");
      const idx = await res.json();
      const eds = await Promise.all((idx.editions || []).map((id) => fetch(`editions/${id}.json`, { cache: "no-cache" }).then((r) => (r.ok ? r.json() : null)).catch(() => null)));
      state.editions = eds.filter((e) => e && Array.isArray(e.recipes)).sort((a, b) => b.number - a.number);
      for (const ed of state.editions) for (const r of ed.recipes) { r._edition = ed; state.bySlug.set(r.slug, r); }
      if (!state.editions.length) throw new Error("leeg");
      renderArchive();
      route();
    } catch (e) {
      $("edition-intro").textContent = "De recepten konden niet worden geladen. Ververs de pagina om het opnieuw te proberen.";
    }
  }

  window.addEventListener("hashchange", route);
  $("zoek").addEventListener("input", renderArchive);
  try { matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => requestAnimationFrame(redrawAll)); } catch (e) { /* oudere browsers */ }
  new MutationObserver(() => requestAnimationFrame(redrawAll)).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme", "class"] });
  if (ro) ro.observe($("contour"));
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => requestAnimationFrame(redrawAll));
  drawFooter();
  load();
})();
</script>
