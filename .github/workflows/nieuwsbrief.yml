name: Nieuwsbrief

# Na de meting van een nieuwe editie (trendlabels en sparklines staan dan in de editie):
# 1. maakt scripts/newsletter.py de mail (mail/<id>/), 2. die gaat live op de site (plaatjes in de mail komen daarvandaan),
# 3. scripts/laposta.py verstuurt de campagne "Proef <id>" via Laposta naar de lijst.
# Automatisch versturen gebeurt alleen voor een editie van de afgelopen 3 dagen; voor een oudere editie gebeurt
# er niets. Wil je eerst zelf kijken: zet de repository-variabele NIEUWSBRIEF op "klaarzetten"
# (Settings → Secrets and variables → Actions → Variables); dan komt er een testmail en verstuur je in Laposta.
# Een editie wordt nooit twee keer verstuurd: laposta.py stopt als "Proef <id>" al verstuurd is.
#
# Nodig als secrets: LAPOSTA_API_KEY, LAPOSTA_FROM_EMAIL (goedgekeurd afzendadres) en LAPOSTA_TEST_EMAIL (redactie).
on:
  workflow_run:
    workflows: ["Trends en foto's meten"]
    types: [completed]
  workflow_dispatch:
    inputs:
      edition:
        description: "Editie-id (leeg = nieuwste uit editions/index.json)"
        required: false
      mode:
        description: "klaarzetten (met testmail) of versturen"
        required: false
        default: klaarzetten
        type: choice
        options: [klaarzetten, versturen]

permissions:
  contents: write

concurrency:
  group: nieuwsbrief
  cancel-in-progress: false

jobs:
  mail:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      EDITION_INPUT: ${{ github.event.inputs.edition }}
      MODE: ${{ github.event.inputs.mode || (vars.NIEUWSBRIEF == 'klaarzetten' && 'klaarzetten') || 'versturen' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Welke editie, en is hij nieuw?
        id: ed
        run: |
          ID="$EDITION_INPUT"
          if [ -z "$ID" ]; then ID=$(python3 -c "import json;print(json.load(open('editions/index.json'))['editions'][0])"); fi
          AGE=$(python3 -c "import json,datetime as d;e=json.load(open('editions/$ID.json'));print((d.date.today()-d.date.fromisoformat(e['date'])).days)")
          echo "id=$ID" >> "$GITHUB_OUTPUT"
          # automatisch (na een meting) alleen voor een editie van de afgelopen 3 dagen; een oude editie die opnieuw
          # gemeten wordt (bijvoorbeeld na een aanpassing) krijgt geen mail en geen campagne
          if [ "${{ github.event_name }}" != "workflow_dispatch" ] && [ "$AGE" -gt 3 ]; then
            echo "Editie $ID is $AGE dagen oud: geen nieuwsbrief."; echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v5
        if: steps.ed.outputs.skip != 'true'
        with:
          python-version: "3.12"
      - run: pip install pillow
        if: steps.ed.outputs.skip != 'true'
      - name: Secrets aanwezig?
        if: steps.ed.outputs.skip != 'true'
        env:
          LAPOSTA_API_KEY: ${{ secrets.LAPOSTA_API_KEY }}
          LAPOSTA_FROM_EMAIL: ${{ secrets.LAPOSTA_FROM_EMAIL }}
        run: |
          [ -n "$LAPOSTA_API_KEY" ] || { echo "::error::Secret LAPOSTA_API_KEY ontbreekt"; exit 1; }
          [ -n "$LAPOSTA_FROM_EMAIL" ] || { echo "::error::Secret LAPOSTA_FROM_EMAIL ontbreekt"; exit 1; }
      - name: Mail maken
        id: make
        if: steps.ed.outputs.skip != 'true'
        run: |
          ID="${{ steps.ed.outputs.id }}"
          echo "id=$ID" >> "$GITHUB_OUTPUT"
          python3 scripts/newsletter.py "$ID"
      - name: Live zetten
        if: steps.ed.outputs.skip != 'true'
        run: |
          git config user.name "proef-bot"
          git config user.email "proef-bot@users.noreply.github.com"
          git add mail/
          if ! git diff --cached --quiet; then
            git commit -m "Nieuwsbrief gemaakt (${{ steps.make.outputs.id }})"
            git pull --rebase origin main
            git push
          fi
      - name: Wachten tot de site bijgewerkt is
        if: steps.ed.outputs.skip != 'true'
        run: |
          ID="${{ steps.make.outputs.id }}"
          for i in $(seq 1 60); do
            if curl -sf "https://edial.github.io/proef/mail/$ID/mail.json?t=$i" | cmp -s - "mail/$ID/mail.json"; then echo "live"; exit 0; fi
            sleep 10
          done
          echo "::error::De mail staat na 10 minuten nog niet op de site"; exit 1
      - name: Laposta
        if: steps.ed.outputs.skip != 'true'
        env:
          LAPOSTA_API_KEY: ${{ secrets.LAPOSTA_API_KEY }}
          LAPOSTA_FROM_EMAIL: ${{ secrets.LAPOSTA_FROM_EMAIL }}
          LAPOSTA_TEST_EMAIL: ${{ secrets.LAPOSTA_TEST_EMAIL }}
        run: |
          ID="${{ steps.make.outputs.id }}"
          if [ "$MODE" = "versturen" ]; then
            python3 scripts/laposta.py send "$ID"
          else
            python3 scripts/laposta.py prepare "$ID" "$LAPOSTA_TEST_EMAIL"
          fi
