name: Bronnen ophalen

# Elke vrijdagnacht de feeds van data/sources.csv lezen, zodat de routine op zaterdag een verse data/buzz.json heeft.
on:
  schedule:
    - cron: "0 22 * * 5"   # vrijdag 22:00 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: posts   # dezelfde groep als "Instagram dagelijks": nooit tegelijk data/posts.csv schrijven
  cancel-in-progress: false

jobs:
  harvest:
    runs-on: ubuntu-latest
    env:
      RUNLOG_FILE: /tmp/runlog.json   # cijfers voor LOGBOEK.md (scripts/runlog.py)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Nieuwe bronnen controleren
        run: python3 scripts/check_sources.py
      - name: Feeds ophalen
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: python3 scripts/harvest.py --google 40
      - name: Opslaan
        run: |
          git config user.name "proef-bot"
          git config user.email "proef-bot@users.noreply.github.com"
          git add data/sources.csv data/posts.csv data/buzz.json
          git diff --cached --quiet && exit 0
          git commit -m "Bronnen opgehaald ($(date -u +%F))"
          for i in 1 2 3; do git pull --rebase origin main && git push && exit 0; sleep 10; done
          exit 1
      - name: Cijfers voor het logboek
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runlog
          path: /tmp/runlog.json
          if-no-files-found: ignore
          retention-days: 7
