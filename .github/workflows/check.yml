name: Controle

# Bij elke push: voldoen alle edities aan de regels uit REDACTIE.md?
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scripts/check_edition.py | tee /tmp/check.txt
        shell: bash   # met pipefail: een fout blijft een fout, ook met tee erachter
      - run: python3 scripts/build_pages.py --check | tee -a /tmp/check.txt
        shell: bash   # met pipefail: een fout blijft een fout, ook met tee erachter
      - name: Fout voor het logboek
        if: failure()
        env:
          RUNLOG_FILE: /tmp/runlog.json
        run: python3 scripts/runlog.py metric fout="$(grep -m1 -E 'FOUT|verouderd|ontbreekt' /tmp/check.txt | cut -c1-200)"
      - name: Cijfers voor het logboek
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runlog
          path: /tmp/runlog.json
          if-no-files-found: ignore
          retention-days: 7
